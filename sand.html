<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sand</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    user-select: none;
  }
  canvas {
    display: block;
    cursor: crosshair;
    flex: 1;
    image-rendering: pixelated;
  }
  #toolbar {
    display: flex;
    gap: 2px;
    padding: 8px 12px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-wrap: wrap;
    align-items: center;
  }
  .element-btn {
    padding: 6px 14px;
    border: 2px solid #333;
    border-radius: 4px;
    background: #222;
    color: #aaa;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: border-color 0.15s, color 0.15s;
  }
  .element-btn:hover { border-color: #666; color: #ddd; }
  .element-btn.active { color: #fff; border-color: currentColor; }
  .spacer { flex: 1; }
  #info {
    color: #444;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 0 8px;
  }
  #brush-size {
    color: #555;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
  }
  #brush-size input {
    width: 60px;
    accent-color: #888;
  }
</style>
</head>
<body>
<div id="toolbar">
  <button class="element-btn active" data-element="sand" style="--c: #d4a843">sand</button>
  <button class="element-btn" data-element="water" style="--c: #4488cc">water</button>
  <button class="element-btn" data-element="stone" style="--c: #888888">stone</button>
  <button class="element-btn" data-element="fire" style="--c: #ff6622">fire</button>
  <button class="element-btn" data-element="plant" style="--c: #44aa44">plant</button>
  <button class="element-btn" data-element="oil" style="--c: #886633">oil</button>
  <button class="element-btn" data-element="salt" style="--c: #dddde8">salt</button>
  <button class="element-btn" data-element="lava" style="--c: #ff4400">lava</button>
  <button class="element-btn" data-element="acid" style="--c: #88ff22">acid</button>
  <button class="element-btn" data-element="erase" style="--c: #ff3355">erase</button>
  <div class="spacer"></div>
  <div id="brush-size">
    brush <input type="range" min="1" max="12" value="3" id="brush">
  </div>
  <span id="info"></span>
</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const info = document.getElementById('info');
const brushSlider = document.getElementById('brush');

// --- Grid setup ---
const CELL = 3;
let W, H, cols, rows;
let grid, gridNext;

// Element types
const EMPTY = 0;
const SAND = 1;
const WATER = 2;
const STONE = 3;
const FIRE = 4;
const PLANT = 5;
const STEAM = 6;
const OIL = 7;
const SALT = 8;
const EMBER = 9;
const SMOKE = 10;
const LAVA = 11;
const ACID = 12;

// Properties: density (higher = heavier), flammable, liquid
const DENSITY = [0, 8, 4, 99, 0.5, 7, 0.2, 3, 8, 0.4, 0.1, 10, 3.5];
const FLAMMABLE = [false, false, false, false, false, true, false, true, false, false, false, false, false];
const LIQUID = [false, false, true, false, false, false, true, true, false, true, true, true, true];

// Color palettes — each element gets a base + slight variation
function elementColor(type, variant) {
  const v = variant || 0;
  switch (type) {
    case SAND:  return [210 + v*8, 168 + v*6, 67 + v*10];
    case WATER: return [40 + v*5, 100 + v*10, 200 + v*8];
    case STONE: return [120 + v*15, 120 + v*15, 125 + v*15];
    case FIRE:  return [255, 80 + v*40, v*15];
    case PLANT: return [30 + v*12, 140 + v*20, 30 + v*10];
    case STEAM: return [180 + v*15, 190 + v*15, 210 + v*10];
    case OIL:   return [100 + v*10, 70 + v*10, 30 + v*8];
    case SALT:  return [210 + v*10, 210 + v*10, 225 + v*8];
    case EMBER: return [200 + v*20, 50 + v*20, 0];
    case SMOKE: return [60 + v*10, 60 + v*10, 65 + v*10];
    case LAVA:  return [255, 60 + v*20, v*5];
    case ACID:  return [100 + v*15, 240 + v*10, 30 + v*15];
    default:    return [0, 0, 0];
  }
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W;
  canvas.height = H;
  const newCols = Math.floor(W / CELL);
  const newRows = Math.floor(H / CELL);

  if (grid && newCols === cols && newRows === rows) return;

  const oldGrid = grid;
  const oldCols = cols;
  const oldRows = rows;

  cols = newCols;
  rows = newRows;
  grid = new Uint8Array(cols * rows);
  gridNext = new Uint8Array(cols * rows);

  // variant map — gives each particle a visual identity
  if (!window.variants || oldCols !== cols || oldRows !== rows) {
    window.variants = new Uint8Array(cols * rows);
  }

  // life counter for fire/steam/acid — Int16 to avoid underflow
  if (!window.life || oldCols !== cols || oldRows !== rows) {
    window.life = new Int16Array(cols * rows);
  }

  // Copy old grid if resizing
  if (oldGrid) {
    const mc = Math.min(cols, oldCols);
    const mr = Math.min(rows, oldRows);
    for (let y = 0; y < mr; y++) {
      for (let x = 0; x < mc; x++) {
        grid[y * cols + x] = oldGrid[y * oldCols + x];
      }
    }
  }
}
resize();
window.addEventListener('resize', resize);

function idx(x, y) { return y * cols + x; }
function get(x, y) {
  if (x < 0 || x >= cols || y < 0 || y >= rows) return STONE; // walls
  return grid[y * cols + x];
}
function set(x, y, type) {
  if (x < 0 || x >= cols || y < 0 || y >= rows) return;
  const i = y * cols + x;
  grid[i] = type;
  if (type !== EMPTY) {
    window.variants[i] = Math.floor(Math.random() * 4);
    if (type === FIRE) window.life[i] = 20 + Math.floor(Math.random() * 30);
    if (type === STEAM) window.life[i] = 40 + Math.floor(Math.random() * 60);
    if (type === EMBER) window.life[i] = 5 + Math.floor(Math.random() * 15);
    if (type === SMOKE) window.life[i] = 30 + Math.floor(Math.random() * 40);
    if (type === ACID) window.life[i] = 80 + Math.floor(Math.random() * 120);
  }
}

// --- Update logic ---
// Process bottom-to-top so gravity works in one pass
// Alternate left-right scan to prevent bias
let frame = 0;

function update() {
  frame++;
  const startX = frame % 2 === 0 ? 0 : cols - 1;
  const endX = frame % 2 === 0 ? cols : -1;
  const dx = frame % 2 === 0 ? 1 : -1;

  for (let y = rows - 1; y >= 0; y--) {
    for (let x = startX; x !== endX; x += dx) {
      const i = idx(x, y);
      const type = grid[i];
      if (type === EMPTY || type === STONE) continue;

      switch (type) {
        case SAND:
        case SALT:
          updatePowder(x, y, type);
          break;
        case WATER:
        case OIL:
          updateLiquid(x, y, type);
          break;
        case FIRE:
          updateFire(x, y);
          break;
        case PLANT:
          updatePlant(x, y);
          break;
        case STEAM:
          updateSteam(x, y);
          break;
        case EMBER:
          updateEmber(x, y);
          break;
        case SMOKE:
          updateSmoke(x, y);
          break;
        case LAVA:
          updateLava(x, y);
          break;
        case ACID:
          updateAcid(x, y);
          break;
      }
    }
  }
}

function updatePowder(x, y, type) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    swap(x, y, x, y + 1);
  } else if (LIQUID[below]) {
    // sink through liquids
    if (DENSITY[type] > DENSITY[below]) {
      swap(x, y, x, y + 1);
    }
  } else {
    // slide diagonally
    const dir = Math.random() < 0.5 ? -1 : 1;
    const bl = get(x + dir, y + 1);
    const br = get(x - dir, y + 1);
    if (bl === EMPTY || (LIQUID[bl] && DENSITY[type] > DENSITY[bl])) {
      swap(x, y, x + dir, y + 1);
    } else if (br === EMPTY || (LIQUID[br] && DENSITY[type] > DENSITY[br])) {
      swap(x, y, x - dir, y + 1);
    }
  }

  // Salt dissolves in water
  if (type === SALT) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx2 = -1; dx2 <= 1; dx2++) {
        if (get(x + dx2, y + dy) === WATER && Math.random() < 0.005) {
          set(x, y, EMPTY);
          // Tint the water slightly (just remove salt)
          return;
        }
      }
    }
  }
}

function updateLiquid(x, y, type) {
  const below = get(x, y + 1);
  if (below === EMPTY) {
    swap(x, y, x, y + 1);
    return;
  }

  // Heavier liquid sinks
  if (LIQUID[below] && DENSITY[type] > DENSITY[below]) {
    swap(x, y, x, y + 1);
    return;
  }

  // Diagonal fall
  const dir = Math.random() < 0.5 ? -1 : 1;
  const bl = get(x + dir, y + 1);
  const br = get(x - dir, y + 1);
  if (bl === EMPTY) {
    swap(x, y, x + dir, y + 1);
  } else if (br === EMPTY) {
    swap(x, y, x - dir, y + 1);
  } else {
    // Flow sideways
    const sl = get(x + dir, y);
    const sr = get(x - dir, y);
    if (sl === EMPTY) {
      swap(x, y, x + dir, y);
    } else if (sr === EMPTY) {
      swap(x, y, x - dir, y);
    } else if (LIQUID[sl] && DENSITY[type] > DENSITY[sl]) {
      swap(x, y, x + dir, y);
    } else if (LIQUID[sr] && DENSITY[type] > DENSITY[sr]) {
      swap(x, y, x - dir, y);
    }
  }
}

function updateFire(x, y) {
  const i = idx(x, y);
  window.life[i]--;

  if (window.life[i] <= 0) {
    // Fire dies → sometimes smoke
    set(x, y, Math.random() < 0.3 ? SMOKE : EMPTY);
    return;
  }

  // Spread to flammable neighbors
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx2 = -1; dx2 <= 1; dx2++) {
      if (dx2 === 0 && dy === 0) continue;
      const nx = x + dx2, ny = y + dy;
      const neighbor = get(nx, ny);
      if (FLAMMABLE[neighbor] && Math.random() < 0.08) {
        set(nx, ny, FIRE);
      }
      // Fire + water → steam
      if (neighbor === WATER && Math.random() < 0.3) {
        set(nx, ny, STEAM);
        if (Math.random() < 0.4) {
          set(x, y, EMPTY);
          return;
        }
      }
    }
  }

  // Fire rises
  const above = get(x, y - 1);
  if (above === EMPTY && Math.random() < 0.6) {
    swap(x, y, x, y - 1);
  } else {
    // drift sideways
    const dir = Math.random() < 0.5 ? -1 : 1;
    if (get(x + dir, y - 1) === EMPTY && Math.random() < 0.3) {
      swap(x, y, x + dir, y - 1);
    }
  }
}

function updatePlant(x, y) {
  // Grow when water is adjacent
  let nearWater = false;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx2 = -1; dx2 <= 1; dx2++) {
      if (get(x + dx2, y + dy) === WATER) nearWater = true;
    }
  }

  if (nearWater && Math.random() < 0.01) {
    // Grow into a random adjacent empty cell
    const dirs = [[-1,0],[1,0],[0,-1],[0,1],[-1,-1],[1,-1]]; // favor upward
    const shuffled = dirs.sort(() => Math.random() - 0.5);
    for (const [gx, gy] of shuffled) {
      if (get(x + gx, y + gy) === EMPTY) {
        set(x + gx, y + gy, PLANT);
        break;
      }
    }
  }

  // Absorb water occasionally (consume it)
  if (nearWater && Math.random() < 0.003) {
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx2 = -1; dx2 <= 1; dx2++) {
        if (get(x + dx2, y + dy) === WATER) {
          set(x + dx2, y + dy, EMPTY);
          return;
        }
      }
    }
  }
}

function updateSteam(x, y) {
  const i = idx(x, y);
  window.life[i]--;

  if (window.life[i] <= 0) {
    // Steam condenses back to water sometimes
    set(x, y, Math.random() < 0.4 ? WATER : EMPTY);
    return;
  }

  // Rise
  const above = get(x, y - 1);
  if (above === EMPTY) {
    swap(x, y, x, y - 1);
  } else {
    const dir = Math.random() < 0.5 ? -1 : 1;
    if (get(x + dir, y - 1) === EMPTY) {
      swap(x, y, x + dir, y - 1);
    } else if (get(x + dir, y) === EMPTY) {
      swap(x, y, x + dir, y);
    } else if (get(x - dir, y) === EMPTY) {
      swap(x, y, x - dir, y);
    }
  }
}

function updateEmber(x, y) {
  const i = idx(x, y);
  window.life[i]--;
  if (window.life[i] <= 0) {
    set(x, y, EMPTY);
    return;
  }
  // Fall like sand but slowly
  if (Math.random() < 0.4) {
    const below = get(x, y + 1);
    if (below === EMPTY) swap(x, y, x, y + 1);
  }
  // Ignite neighbors
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx2 = -1; dx2 <= 1; dx2++) {
      if (FLAMMABLE[get(x + dx2, y + dy)] && Math.random() < 0.04) {
        set(x + dx2, y + dy, FIRE);
      }
    }
  }
}

function updateSmoke(x, y) {
  const i = idx(x, y);
  window.life[i]--;
  if (window.life[i] <= 0) {
    set(x, y, EMPTY);
    return;
  }
  // Rise slowly, drift
  if (Math.random() < 0.5) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    if (get(x, y - 1) === EMPTY) {
      swap(x, y, x, y - 1);
    } else if (get(x + dir, y - 1) === EMPTY) {
      swap(x, y, x + dir, y - 1);
    } else if (get(x + dir, y) === EMPTY && Math.random() < 0.3) {
      swap(x, y, x + dir, y);
    }
  }
}

function updateLava(x, y) {
  // Lava flows like a liquid but slow
  // Ignite flammable neighbors, turn water to steam, cool into stone
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx2 = -1; dx2 <= 1; dx2++) {
      if (dx2 === 0 && dy === 0) continue;
      const nx = x + dx2, ny = y + dy;
      const neighbor = get(nx, ny);
      if (FLAMMABLE[neighbor]) {
        set(nx, ny, FIRE);
      }
      if (neighbor === WATER) {
        set(nx, ny, STEAM);
        // Lava cools to stone
        if (Math.random() < 0.15) {
          set(x, y, STONE);
          return;
        }
      }
      if (neighbor === SAND && Math.random() < 0.002) {
        // Sand melts into more lava very slowly
        set(nx, ny, LAVA);
      }
    }
  }

  // Flow slowly — only move ~60% of frames
  if (Math.random() > 0.6) return;

  const below = get(x, y + 1);
  if (below === EMPTY) {
    swap(x, y, x, y + 1);
    return;
  }
  if (LIQUID[below] && DENSITY[LAVA] > DENSITY[below] && below !== LAVA) {
    swap(x, y, x, y + 1);
    return;
  }

  const dir = Math.random() < 0.5 ? -1 : 1;
  const bl = get(x + dir, y + 1);
  if (bl === EMPTY) {
    swap(x, y, x + dir, y + 1);
  } else {
    const sl = get(x + dir, y);
    if (sl === EMPTY && Math.random() < 0.3) {
      swap(x, y, x + dir, y);
    }
  }
}

function updateAcid(x, y) {
  const i = idx(x, y);
  window.life[i]--;
  if (window.life[i] <= 0) {
    set(x, y, EMPTY);
    return;
  }

  // Dissolve neighbors (not stone, not other acid, not lava)
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx2 = -1; dx2 <= 1; dx2++) {
      if (dx2 === 0 && dy === 0) continue;
      const nx = x + dx2, ny = y + dy;
      const neighbor = get(nx, ny);
      if (neighbor !== EMPTY && neighbor !== STONE && neighbor !== ACID && neighbor !== LAVA && Math.random() < 0.03) {
        set(nx, ny, SMOKE);
        window.life[i] -= 10; // acid weakens when dissolving
        if (window.life[i] <= 0) {
          set(x, y, EMPTY);
          return;
        }
      }
    }
  }

  // Flow like liquid
  const below = get(x, y + 1);
  if (below === EMPTY) {
    swap(x, y, x, y + 1);
    return;
  }
  if (LIQUID[below] && DENSITY[ACID] > DENSITY[below] && below !== ACID) {
    swap(x, y, x, y + 1);
    return;
  }
  const dir = Math.random() < 0.5 ? -1 : 1;
  const bl = get(x + dir, y + 1);
  const br = get(x - dir, y + 1);
  if (bl === EMPTY) {
    swap(x, y, x + dir, y + 1);
  } else if (br === EMPTY) {
    swap(x, y, x - dir, y + 1);
  } else {
    if (get(x + dir, y) === EMPTY) swap(x, y, x + dir, y);
    else if (get(x - dir, y) === EMPTY) swap(x, y, x - dir, y);
  }
}

function swap(x1, y1, x2, y2) {
  if (x2 < 0 || x2 >= cols || y2 < 0 || y2 >= rows) return;
  const i1 = idx(x1, y1);
  const i2 = idx(x2, y2);
  const tmp = grid[i1];
  grid[i1] = grid[i2];
  grid[i2] = tmp;
  // swap variants and life too
  const tv = window.variants[i1];
  window.variants[i1] = window.variants[i2];
  window.variants[i2] = tv;
  const tl = window.life[i1];
  window.life[i1] = window.life[i2];
  window.life[i2] = tl;
}

// --- Drawing ---
let cachedImageData = null;
function draw() {
  if (!cachedImageData || cachedImageData.width !== W || cachedImageData.height !== H) {
    cachedImageData = ctx.createImageData(W, H);
  }
  const imageData = cachedImageData;
  const data = imageData.data;
  // Clear all pixels (transparent → body #111 shows through)
  const buf32 = new Uint32Array(data.buffer);
  buf32.fill(0xFF111111); // ABGR: opaque #111

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const type = grid[idx(x, y)];
      if (type === EMPTY) continue;

      const v = window.variants[idx(x, y)];
      let [r, g, b] = elementColor(type, v);

      // Fire flicker
      if (type === FIRE) {
        const life = window.life[idx(x, y)];
        const intensity = Math.min(1, life / 15);
        const flicker = 0.7 + 0.3 * Math.sin(frame * 0.5 + x * 3.7 + y * 2.3);
        r = Math.floor(r * intensity * flicker);
        g = Math.floor(g * intensity * flicker);
        b = Math.floor(b * intensity);
      }

      // Lava glow — pulse slowly
      if (type === LAVA) {
        const pulse = 0.8 + 0.2 * Math.sin(frame * 0.03 + x * 0.5 + y * 0.3);
        r = Math.min(255, Math.floor(r * pulse));
        g = Math.floor(g * pulse);
      }

      // Smoke/steam fade
      if (type === SMOKE || type === STEAM) {
        const life = window.life[idx(x, y)];
        const alpha = Math.min(1, life / 20);
        r = Math.floor(r * alpha);
        g = Math.floor(g * alpha);
        b = Math.floor(b * alpha);
      }

      // Fill CELL×CELL block
      for (let py = 0; py < CELL; py++) {
        for (let px = 0; px < CELL; px++) {
          const sx = x * CELL + px;
          const sy = y * CELL + py;
          if (sx >= W || sy >= H) continue;
          const pi = (sy * W + sx) * 4;
          data[pi] = r;
          data[pi + 1] = g;
          data[pi + 2] = b;
          data[pi + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

// --- Input ---
let mouseDown = false;
let mouseX = 0, mouseY = 0;
let currentElement = SAND;
let brushSize = 3;

const elementMap = {
  'sand': SAND, 'water': WATER, 'stone': STONE, 'fire': FIRE,
  'plant': PLANT, 'oil': OIL, 'salt': SALT, 'lava': LAVA, 'acid': ACID, 'erase': EMPTY
};

document.querySelectorAll('.element-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentElement = elementMap[btn.dataset.element];
    // Set button color
    btn.style.color = '';
  });
});

// Set active colors
function updateButtonColors() {
  document.querySelectorAll('.element-btn').forEach(btn => {
    const el = elementMap[btn.dataset.element];
    if (btn.classList.contains('active')) {
      const c = el === EMPTY ? [255, 50, 80] : elementColor(el, 2);
      btn.style.borderColor = `rgb(${c[0]},${c[1]},${c[2]})`;
      btn.style.color = `rgb(${c[0]},${c[1]},${c[2]})`;
    } else {
      btn.style.borderColor = '';
      btn.style.color = '';
    }
  });
}
updateButtonColors();
document.querySelectorAll('.element-btn').forEach(b =>
  b.addEventListener('click', updateButtonColors)
);

brushSlider.addEventListener('input', () => {
  brushSize = parseInt(brushSlider.value);
});

function paint(cx, cy) {
  const gx = Math.floor(cx / CELL);
  const gy = Math.floor(cy / CELL);
  for (let dy = -brushSize; dy <= brushSize; dy++) {
    for (let dx2 = -brushSize; dx2 <= brushSize; dx2++) {
      if (dx2 * dx2 + dy * dy > brushSize * brushSize) continue;
      const px = gx + dx2;
      const py = gy + dy;
      if (px < 0 || px >= cols || py < 0 || py >= rows) continue;

      if (currentElement === EMPTY) {
        // Erase
        grid[idx(px, py)] = EMPTY;
      } else {
        // Only place into empty cells (or add randomness for liquids)
        if (grid[idx(px, py)] === EMPTY) {
          set(px, py, currentElement);
        }
      }
    }
  }
}

canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  paint(mouseX, mouseY);
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  if (mouseDown) paint(mouseX, mouseY);
});

canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  mouseDown = true;
  const rect = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - rect.left;
  mouseY = e.touches[0].clientY - rect.top;
  paint(mouseX, mouseY);
});
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - rect.left;
  mouseY = e.touches[0].clientY - rect.top;
  if (mouseDown) paint(mouseX, mouseY);
});
canvas.addEventListener('touchend', () => { mouseDown = false; });

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  const keys = { '1': 'sand', '2': 'water', '3': 'stone', '4': 'fire', '5': 'plant', '6': 'oil', '7': 'salt', '8': 'lava', '9': 'acid', '0': 'erase' };
  if (keys[e.key]) {
    document.querySelectorAll('.element-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`[data-element="${keys[e.key]}"]`);
    btn.classList.add('active');
    currentElement = elementMap[keys[e.key]];
    updateButtonColors();
  }
  if (e.key === 'c' || e.key === 'C') {
    grid.fill(0);
    window.life.fill(0);
  }
  if (e.key === '[') brushSlider.value = Math.max(1, brushSize - 1);
  if (e.key === ']') brushSlider.value = Math.min(12, brushSize + 1);
  brushSize = parseInt(brushSlider.value);
});

// --- Main loop ---
let particleCount = 0;

function loop() {
  update();
  draw();

  // Count particles every 30 frames
  if (frame % 30 === 0) {
    particleCount = 0;
    for (let i = 0; i < grid.length; i++) {
      if (grid[i] !== EMPTY) particleCount++;
    }
    info.textContent = particleCount.toLocaleString() + ' particles · c to clear · [ ] brush · 1-9 elements · 0 erase';
  }

  requestAnimationFrame(loop);
}

loop();
</script>
