<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falling Letters</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    cursor: text;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #444;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    transition: opacity 3s;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">just type</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const GRAVITY = 800;
const RESTITUTION = 0.3;
const FONT_SIZE = 28;
const LETTER_W = FONT_SIZE * 0.6;
const LETTER_H = FONT_SIZE * 0.9;

let totalTyped = 0;
let hintShown = true;
let spawnY = 80;
let nextX;

function resetCursor() {
  nextX = W * 0.2;
  spawnY = 80;
}
resetCursor();

class Letter {
  constructor(char, x, y, index) {
    this.char = char;
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 20;
    this.vy = (Math.random()) * 10;
    this.rotation = (Math.random() - 0.5) * 0.2;
    this.vr = (Math.random() - 0.5) * 1.5;
    this.w = LETTER_W;
    this.h = LETTER_H;
    this.resting = false;
    this.restTime = 0;
    this.index = index;
    // hue cycles slowly — letters typed around the same time share color
    this.hue = (index * 2.5) % 360;
  }

  update(dt) {
    if (this.resting) {
      this.restTime += dt;
      return;
    }

    this.vy += GRAVITY * dt;
    this.vx *= 0.998;

    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += this.vr * dt;

    // floor
    if (this.y + this.h / 2 > H - 1) {
      this.y = H - 1 - this.h / 2;
      if (Math.abs(this.vy) < 40) {
        this.settle();
      } else {
        this.vy *= -RESTITUTION;
        this.vx *= 0.7;
        this.vr *= 0.5;
      }
    }

    // walls
    if (this.x < this.w / 2) {
      this.x = this.w / 2;
      this.vx = Math.abs(this.vx) * RESTITUTION;
    }
    if (this.x > W - this.w / 2) {
      this.x = W - this.w / 2;
      this.vx = -Math.abs(this.vx) * RESTITUTION;
    }
  }

  settle() {
    this.resting = true;
    this.vx = 0;
    this.vy = 0;
    this.vr = 0;
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    let alpha, sat;
    if (this.resting) {
      alpha = Math.max(0.35, 1 - this.restTime * 0.08);
      sat = Math.max(15, 55 - this.restTime * 5);
    } else {
      alpha = 1;
      sat = 60;
    }

    ctx.fillStyle = `hsla(${this.hue}, ${sat}%, 75%, ${alpha})`;
    ctx.font = `bold ${FONT_SIZE}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.char, 0, 0);
    ctx.restore();
  }
}

let letters = [];

function collide(a, b) {
  if (a.resting && b.resting) return;

  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const ox = (a.w + b.w) / 2 - Math.abs(dx);
  const oy = (a.h + b.h) / 2 - Math.abs(dy);

  if (ox <= 0 || oy <= 0) return;

  if (ox < oy) {
    // horizontal push
    const sign = dx > 0 ? 1 : -1;
    if (!a.resting && !b.resting) {
      a.x += sign * ox * 0.5;
      b.x -= sign * ox * 0.5;
      const tv = a.vx;
      a.vx = b.vx * RESTITUTION;
      b.vx = tv * RESTITUTION;
    } else if (b.resting) {
      a.x += sign * ox;
      a.vx = -a.vx * RESTITUTION;
    } else {
      b.x -= sign * ox;
      b.vx = -b.vx * RESTITUTION;
    }
  } else {
    // vertical push
    const sign = dy > 0 ? 1 : -1;
    if (!a.resting && !b.resting) {
      a.y += sign * oy * 0.5;
      b.y -= sign * oy * 0.5;
      const tv = a.vy;
      a.vy = b.vy * RESTITUTION;
      b.vy = tv * RESTITUTION;
      a.vr += (Math.random() - 0.5);
      b.vr += (Math.random() - 0.5);
    } else if (b.resting) {
      // a is falling onto resting b
      a.y += sign * oy;
      if (Math.abs(a.vy) < 60 && a.y < b.y) {
        a.y = b.y - (a.h + b.h) / 2 + 1;
        a.settle();
      } else {
        a.vy = -a.vy * RESTITUTION;
        a.vr += (Math.random() - 0.5) * 2;
      }
    } else {
      b.y -= sign * oy;
      if (Math.abs(b.vy) < 60 && b.y < a.y) {
        b.y = a.y - (a.h + b.h) / 2 + 1;
        b.settle();
      } else {
        b.vy = -b.vy * RESTITUTION;
        b.vr += (Math.random() - 0.5) * 2;
      }
    }
  }
}

function checkCollisions() {
  const cell = FONT_SIZE * 2;
  const grid = {};

  for (let i = 0; i < letters.length; i++) {
    const l = letters[i];
    const gx = Math.floor(l.x / cell);
    const gy = Math.floor(l.y / cell);

    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const key = (gx + dx) + ',' + (gy + dy);
        if (grid[key]) {
          for (const j of grid[key]) {
            collide(letters[i], letters[j]);
          }
        }
      }
    }

    const key = gx + ',' + gy;
    if (!grid[key]) grid[key] = [];
    grid[key].push(i);
  }
}

// input
window.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === 'Escape') {
    letters = [];
    totalTyped = 0;
    resetCursor();
    return;
  }

  if (hintShown) {
    document.getElementById('hint').style.opacity = '0';
    hintShown = false;
  }

  if (e.key === 'Enter') {
    nextX = W * 0.2;
    spawnY = Math.min(spawnY + FONT_SIZE * 1.3, H * 0.45);
    return;
  }

  if (e.key === 'Backspace') {
    e.preventDefault();
    if (letters.length > 0) {
      const last = letters[letters.length - 1];
      last.resting = false;
      last.vy = -500 - Math.random() * 300;
      last.vx = (Math.random() - 0.5) * 400;
      last.vr = (Math.random() - 0.5) * 12;
      nextX -= LETTER_W;
    }
    return;
  }

  if (e.key === ' ') {
    e.preventDefault();
    nextX += LETTER_W;
    return;
  }

  if (e.key.length === 1) {
    const letter = new Letter(e.key, nextX, spawnY, totalTyped);
    letters.push(letter);
    totalTyped++;
    nextX += LETTER_W;

    if (nextX > W * 0.85) {
      nextX = W * 0.2;
      spawnY = Math.min(spawnY + FONT_SIZE * 1.3, H * 0.45);
    }

    // performance cap
    if (letters.length > 600) {
      letters.splice(0, 30);
    }
  }
});

// animation
let lastTime = performance.now();

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;

  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  for (const l of letters) l.update(dt);
  checkCollisions();
  for (const l of letters) l.draw();

  // cursor indicator
  ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.fillRect(nextX - 1, spawnY - FONT_SIZE * 0.4, 2, FONT_SIZE * 0.8);

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
