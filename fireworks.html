<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fireworks</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; }
  canvas { display: block; cursor: crosshair; }
  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    color: rgba(220, 225, 240, 0.55); font: 13px/1.6 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.08em; text-align: center; pointer-events: none;
    transition: opacity 2.5s ease; user-select: none;
  }
  #hint.faded { opacity: 0; }
  #hint b { color: rgba(220, 225, 240, 0.85); font-weight: 600; }
</style>
<canvas id="c"></canvas>
<div id="hint"><b>fireworks</b><br>click to launch &middot; <b>f</b> finale &middot; <b>a</b> auto &middot; <b>m</b> mute</div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

const stars = [];
let skyline = [];

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSky();
}

function buildSky() {
  stars.length = 0;
  for (let i = 0; i < 140; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.75,
                 r: Math.random() * 1.1 + 0.3, tw: Math.random() * Math.PI * 2,
                 sp: 0.5 + Math.random() * 1.5 });
  }
  skyline = [];
  let x = -20;
  while (x < W + 20) {
    const w = 30 + Math.random() * 70;
    const h = 30 + Math.random() * Math.random() * 130;
    const b = { x, w, h, windows: [] };
    for (let wx = 5; wx < w - 6; wx += 9) {
      for (let wy = 8; wy < h - 6; wy += 13) {
        if (Math.random() < 0.16) b.windows.push({ x: wx, y: wy });
      }
    }
    skyline.push(b);
    x += w + (Math.random() < 0.25 ? 10 + Math.random() * 40 : 0);
  }
}

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, muted = false;

function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = 0.5;
  master.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function noiseSrc(t, dur) {
  const s = AC.createBufferSource();
  s.buffer = noiseBuf;
  s.loop = true;
  s.start(t, Math.random() * 1.5);
  s.stop(t + dur + 0.05);
  return s;
}

function whoosh() {
  if (!AC || muted) return;
  const t = AC.currentTime;
  const src = noiseSrc(t, 0.9);
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(300, t);
  bp.frequency.exponentialRampToValueAtTime(1400, t + 0.8);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.05, t + 0.15);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  src.connect(bp); bp.connect(g); g.connect(master);
}

function boom(size) { // size 0..1
  if (!AC || muted) return;
  const t = AC.currentTime + 0.01;
  // deep thump
  const o = AC.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(110 + size * 40, t);
  o.frequency.exponentialRampToValueAtTime(28, t + 0.4 + size * 0.3);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.5 + size * 0.4, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6 + size * 0.4);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 1.2);
  // air burst
  const src = noiseSrc(t, 1.0);
  const lp = AC.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(2200, t);
  lp.frequency.exponentialRampToValueAtTime(120, t + 0.7 + size * 0.4);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.35 + size * 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8 + size * 0.5);
  src.connect(lp); lp.connect(g); g.connect(master);
}

function crackle(n, dur, delay) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + (delay || 0);
  n = Math.min(n, 70);
  for (let i = 0; i < n; i++) {
    const t = t0 + Math.pow(Math.random(), 0.7) * dur;
    const src = noiseSrc(t, 0.04);
    const hp = AC.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2500 + Math.random() * 3000;
    const g = AC.createGain();
    const v = 0.04 + Math.random() * 0.1;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.02 + Math.random() * 0.03);
    src.connect(hp); hp.connect(g); g.connect(master);
  }
}

// ---------- particles ----------
const rockets = [], parts = [], flashes = [];

function P(x, y, vx, vy, o) {
  return Object.assign({ x, y, vx, vy, life: 1, decay: 0.012, hue: 40, sat: 100,
    lum: 68, size: 3, drag: 0.985, grav: 0.035, trail: false, twinkle: false,
    crackleAt: 0 }, o);
}

function sphere(speed) { // random 3D direction projected to 2D — real shells are spheres
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const s = speed * (0.75 + Math.random() * 0.25);
  return [Math.sin(ph) * Math.cos(th) * s, Math.sin(ph) * Math.sin(th) * s];
}

const TYPES = ['peony', 'chrys', 'willow', 'ring', 'crackle', 'palm', 'double'];

function explode(x, y, type, hue, small) {
  const big = small ? 0.45 : 1;
  flashes.push({ x, y, r: 110 * big, a: small ? 0.18 : 0.32 });
  boom(small ? 0.15 : (type === 'willow' || type === 'palm' ? 0.9 : 0.6));

  if (type === 'peony') {
    const n = small ? 40 : 90;
    for (let i = 0; i < n; i++) {
      const [vx, vy] = sphere(4.6 * big);
      parts.push(P(x, y, vx, vy, { hue: hue + Math.random() * 20 - 10, decay: 0.009 + Math.random() * 0.006 }));
    }
  } else if (type === 'chrys') {
    for (let i = 0; i < 80; i++) {
      const [vx, vy] = sphere(4.2 * big);
      parts.push(P(x, y, vx, vy, { hue, trail: true, decay: 0.008 + Math.random() * 0.005, size: 1.6 }));
    }
  } else if (type === 'willow') {
    for (let i = 0; i < 70; i++) {
      const [vx, vy] = sphere(3.6 * big);
      parts.push(P(x, y, vx, vy, { hue: 42 + Math.random() * 10, sat: 90, lum: 62, trail: true,
        drag: 0.965, grav: 0.028, decay: 0.0035 + Math.random() * 0.002, size: 1.5 }));
    }
  } else if (type === 'ring') {
    const tilt = Math.random() * Math.PI, squash = 0.25 + Math.random() * 0.7, n = 60;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      let vx = Math.cos(a) * 5 * big, vy = Math.sin(a) * 5 * big * squash;
      const rx = vx * Math.cos(tilt) - vy * Math.sin(tilt);
      const ry = vx * Math.sin(tilt) + vy * Math.cos(tilt);
      parts.push(P(x, y, rx, ry, { hue, decay: 0.011, size: 2.2 }));
    }
  } else if (type === 'crackle') {
    for (let i = 0; i < 70; i++) {
      const [vx, vy] = sphere(4 * big);
      parts.push(P(x, y, vx, vy, { hue: 30 + Math.random() * 25, decay: 0.010 + Math.random() * 0.008,
        crackleAt: 0.25 + Math.random() * 0.45 }));
    }
    crackle(60, 1.6, 0.25);
  } else if (type === 'palm') {
    for (let i = 0; i < 16; i++) {
      const [vx, vy] = sphere(3.2 * big);
      parts.push(P(x, y, vx * 1.4, vy * 1.4, { hue: 38 + Math.random() * 14, trail: true, size: 3,
        drag: 0.975, decay: 0.007 + Math.random() * 0.003 }));
    }
    for (let i = 0; i < 30; i++) { // fill sparks
      const [vx, vy] = sphere(2.2 * big);
      parts.push(P(x, y, vx, vy, { hue: 45, lum: 75, size: 1.2, decay: 0.02 }));
    }
  } else if (type === 'double') {
    const n = 70;
    for (let i = 0; i < n; i++) {
      const [vx, vy] = sphere(4.4 * big);
      parts.push(P(x, y, vx, vy, { hue, decay: 0.010 + Math.random() * 0.005 }));
    }
    // secondary breaks after a beat
    const h2 = (hue + 120 + Math.random() * 60) % 360;
    setTimeout(() => {
      for (let k = 0; k < 3; k++) {
        const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 80;
        explode(x + Math.cos(a) * d, y + Math.sin(a) * d - 20, 'peony', h2, true);
      }
    }, 380 + Math.random() * 250);
  }
  // twinkling stragglers on every shell
  if (!small) for (let i = 0; i < 14; i++) {
    const [vx, vy] = sphere(1.6);
    parts.push(P(x, y, vx, vy, { hue: 0, sat: 0, lum: 95, size: 1.3, twinkle: true,
      decay: 0.004 + Math.random() * 0.003, drag: 0.97 }));
  }
}

function launch(tx, ty) {
  const sx = tx + (Math.random() - 0.5) * 60;
  const apexY = Math.min(Math.max(ty, 60), H * 0.62);
  const t = 60 + Math.random() * 20; // frames to apex
  rockets.push({
    x: sx, y: H + 8,
    vx: (tx - sx) / t,
    vy: -Math.sqrt(2 * 0.06 * (H + 8 - apexY)), // reach apex under gravity 0.06
    type: TYPES[Math.floor(Math.random() * TYPES.length)],
    hue: Math.floor(Math.random() * 360)
  });
  whoosh();
}

function finale() {
  for (let i = 0; i < 9; i++) {
    setTimeout(() => launch(W * (0.12 + Math.random() * 0.76), H * (0.12 + Math.random() * 0.3)),
      i * (180 + Math.random() * 220));
  }
}

// ---------- loop ----------
let auto = true, nextAuto = performance.now() + 900, last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 16.67, 3); last = now;

  if (auto && now > nextAuto) {
    launch(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.35));
    if (Math.random() < 0.18) // occasional pair
      setTimeout(() => launch(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.35)), 250);
    nextAuto = now + 1300 + Math.random() * 2200;
  }

  // fade previous frame (leaves trails)
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5, 6, 12, 0.38)';
  ctx.fillRect(0, 0, W, H);

  // stars
  for (const s of stars) {
    const a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now / 1000 * s.sp + s.tw));
    ctx.fillStyle = `rgba(200,210,255,${a})`;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }

  ctx.globalCompositeOperation = 'lighter';

  // flashes
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    const grd = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    grd.addColorStop(0, `rgba(255,244,214,${f.a})`);
    grd.addColorStop(1, 'rgba(255,244,214,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    f.a -= 0.09 * dt;
    if (f.a <= 0) flashes.splice(i, 1);
  }

  // rockets
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.x += r.vx * dt; r.y += r.vy * dt; r.vy += 0.06 * dt;
    ctx.fillStyle = 'rgba(255,220,160,0.9)';
    ctx.fillRect(r.x - 1, r.y - 1, 2.5, 2.5);
    if (Math.random() < 0.6) parts.push(P(r.x, r.y, (Math.random() - 0.5) * 0.4, 0.3,
      { hue: 35, lum: 70, size: 1, decay: 0.06, grav: 0.01 }));
    if (r.vy >= -0.4) { rockets.splice(i, 1); explode(r.x, r.y, r.type, r.hue, false); }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vx *= Math.pow(p.drag, dt); p.vy = p.vy * Math.pow(p.drag, dt) + p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0 || p.y > H + 10) { parts.splice(i, 1); continue; }

    if (p.crackleAt && p.life < p.crackleAt) { // pop into a micro-flash
      p.crackleAt = 0;
      flashes.push({ x: p.x, y: p.y, r: 8 + Math.random() * 8, a: 0.9 });
      p.life = Math.min(p.life, 0.12);
    }

    let a = Math.min(1, p.life * 1.7); // hold near full brightness, then fall off
    if (p.twinkle) a *= Math.random() < 0.5 ? 0.15 : 1;
    const sz = p.size * (0.6 + p.life * 0.6);
    const halo = `hsla(${p.hue},${p.sat}%,${p.lum}%,${a * 0.16})`;
    const core = `hsla(${p.hue},${p.sat}%,${Math.min(p.lum + 28, 96)}%,${a})`;
    if (p.trail) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = halo; ctx.lineWidth = sz * 2.6;
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 3.5, p.y - p.vy * 3.5); ctx.lineTo(p.x, p.y);
      ctx.stroke();
      ctx.strokeStyle = core; ctx.lineWidth = sz;
      ctx.beginPath();
      ctx.moveTo(p.x - p.vx * 3.5, p.y - p.vy * 3.5); ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      const g = sz * 2.4;
      ctx.fillStyle = halo;
      ctx.fillRect(p.x - g / 2, p.y - g / 2, g, g);
      ctx.fillStyle = core;
      ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
  }

  // skyline on top — shells burst behind the city
  ctx.globalCompositeOperation = 'source-over';
  for (const b of skyline) {
    ctx.fillStyle = '#0a0c14';
    ctx.fillRect(b.x, H - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,214,140,0.5)';
    for (const w of b.windows) ctx.fillRect(b.x + w.x, H - b.h + w.y, 3, 4);
  }

  requestAnimationFrame(frame);
}

// ---------- input ----------
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  launch(e.clientX, e.clientY);
  hint.classList.add('faded');
});
window.addEventListener('keydown', e => {
  ensureAudio();
  const k = e.key.toLowerCase();
  if (k === 'a') auto = !auto;
  if (k === 'm') muted = !muted;
  if (k === 'f') { finale(); hint.classList.add('faded'); }
});
const hint = document.getElementById('hint');
setTimeout(() => hint.classList.add('faded'), 9000);

window.addEventListener('resize', resize);
resize();
ctx.fillStyle = '#05060c';
ctx.fillRect(0, 0, W, H);
requestAnimationFrame(frame);
</script>
